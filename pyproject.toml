[build-system]
requires = ["setuptools >= 77", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "postduif"
authors = [
    {name = "Thijs Janssen", email = "thijs@seecr.nl"},
    {name = "Johan Jonkers", email = "johan@seecr.nl"},
]
description = "Async mail for web apps: MIME with inline images, Postal transport, an outbox for development"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["mail", "email", "postal", "asyncio", "mime", "outbox"]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Framework :: AsyncIO",
    "Topic :: Communications :: Email",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx >= 0.28.1, < 1",
]
dynamic = ["version"]

# for development only, not published (PEP 735): pip install -e . --group dev (pip >= 25.1)
[dependency-groups]
test = [
    "pytest >= 9.2.0, < 10",
    "pytest-asyncio >= 1.4.1, < 2",
]
lint = [
    "flake8 >= 7.5.0, < 8",
    "isort >= 9.0.2, < 10",
    "black >= 25.1, < 27",
]
dev = [{include-group = "test"}, {include-group = "lint"}]

[project.urls]
Source = "https://github.com/seecr/postduif"
Issues = "https://github.com/seecr/postduif/issues"
Changelog = "https://github.com/seecr/postduif/blob/main/CHANGELOG.md"

[tool.setuptools_scm]
version_file = "postduif/_version.py"

[tool.setuptools.packages.find]
where = ["."]
include = ["postduif*"]

[tool.isort]
profile = "black"
line_length = 90

[tool.black]
line-length = 90
skip-magic-trailing-comma = true

[tool.pytest]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
